{% extends 'core/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card" style="background-color: #E3F2FD; border-radius: 24px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);">
                <div class="card-header" style="background: linear-gradient(145deg, #B3E5FC, #81D4FA); border-radius: 24px 24px 0 0; color: white; font-size: 1.8rem; padding: 20px; text-align: center;">
                    {% if form.instance.pk %}✏️ Editar Recurso{% else %}📚 Novo Recurso{% endif %}
                </div>
                <div class="card-body" style="padding: 30px;">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="{{ form.title.id_for_label }}" class="form-label fw-bold">📝 Título</label>
                            {{ form.title }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.description.id_for_label }}" class="form-label fw-bold">📄 Descrição</label>
                            {{ form.description }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.category.id_for_label }}" class="form-label fw-bold">🏷️ Categoria</label>
                            {{ form.category }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.file_url.id_for_label }}" class="form-label fw-bold">🔗 URL do Recurso</label>
                            {{ form.file_url }}
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="{% url 'resources:list' %}" class="btn btn-secondary rounded-pill">⬅️ Voltar</a>
                            <button type="submit" class="btn" style="background: linear-gradient(135deg, #FF6B9D, #FFD93D); color: white; border: none; border-radius: 20px; padding: 12px 30px; font-weight: 700;">
                                ✅ Salvar Recurso
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
